# Al subir un tag vX.Y.Z compila el instalador de Windows y lo publica como release de GitHub.
# La landing enlaza a releases/latest/download/HikuiKoe-Setup.exe, que siempre apunta al último.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La versión del instalador sale del tag (v0.2.0 → 0.2.0), así no hay que editar package.json a mano.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        shell: bash
      # electron-builder solo compila: al publicar sube los archivos en paralelo y puede crear releases duplicados.
      - run: npm run dist
      - run: gh release create "$GITHUB_REF_NAME" dist/HikuiKoe-Setup.exe dist/HikuiKoe-Setup.exe.blockmap dist/latest.yml --title "$GITHUB_REF_NAME" --generate-notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
